[project]
name = "nl2cnl"
version = "0.1.0"
description = "Translate natural language queries into a Controlled Natural Language (CNL) with LLMs, and benchmark the translations."
readme = "README.md"
authors = [
    { name = "Malachy23", email = "malachy.parisi04@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lark>=1.3.1",
    "litellm>=1.109.1",
    "numpy>=2.5.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentence-transformers>=6.3.0",
    "torch",
]

[project.scripts]
nl2cnl = "nl2cnl.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
